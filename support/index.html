<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, follow">
<title>Support — Ahead</title>
<style>
  :root{
    --ink:#1c1b1a;
    --muted:#5f5d58;
    --line:#e4e1d8;
    --bg:#faf8f3;
    --card:#ffffff;
    --accent:#5b4ad1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:Georgia,"Times New Roman",serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.7;
    font-size:18px;
    padding:0 20px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:64px 0 96px}
  header{border-bottom:1px solid var(--line);padding-bottom:28px;margin-bottom:40px}
  .kicker{
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    text-transform:uppercase;
    letter-spacing:.14em;
    font-size:12px;
    color:var(--accent);
    font-weight:700;
    margin-bottom:14px;
  }
  h1{font-size:38px;line-height:1.15;font-weight:700;letter-spacing:-.01em;margin-bottom:12px}
  .updated{font-size:14px;color:var(--muted);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
  h2{
    font-size:22px;
    font-weight:700;
    margin:44px 0 14px;
    letter-spacing:-.005em;
    padding-top:8px;
  }
  h3{font-size:18px;font-weight:700;margin:28px 0 8px}
  p{margin:0 0 16px}
  ul{margin:0 0 16px;padding-left:24px}
  li{margin-bottom:9px}
  strong{font-weight:700}
  a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
  .lead{font-size:20px;color:var(--ink)}
  .callout{
    background:var(--card);
    border:1px solid var(--line);
    border-left:3px solid var(--accent);
    border-radius:6px;
    padding:20px 22px;
    margin:24px 0;
    font-size:17px;
  }
  .callout p:last-child{margin-bottom:0}
  .summary{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:24px 26px;
    margin:32px 0 8px;
  }
  .summary h2{margin-top:0;font-size:18px}
  .summary p{margin-bottom:0}
  footer{
    margin-top:64px;
    padding-top:28px;
    border-top:1px solid var(--line);
    font-size:14px;
    color:var(--muted);
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  }
  @media (max-width:560px){
    body{font-size:17px}
    .wrap{padding:44px 0 64px}
    h1{font-size:30px}
    h2{font-size:20px}
  }
</style>
</head>


<body>
<div class="wrap">
<header>
  <div class="kicker">Ahead</div>
  <h1>Support</h1>
</header>

<div class="summary">
<p>For support, email James at jacks.jamesd@gmail.com</p>
  
</div>

</div>
</body>
</html>
